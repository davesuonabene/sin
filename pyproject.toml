[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sin"
version = "0.1.0"
description = "SIN node editor and headless composition audio engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "librosa~=0.11.0",
    "soundfile",
    "pyrubberband==0.4.0",
    "mutagen~=1.47.0",
    "typer",
    "sqlalchemy",
    "pydantic",
    "numpy",
]

[project.scripts]
sin = "cli:app"
